<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JSON 格式化</title>
    <style>
      :root {
        color: #172033;
        background: #f7f8fa;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      main {
        display: grid;
        min-height: calc(100vh - 48px);
        grid-template-rows: auto 1fr auto;
        gap: 16px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        min-height: 38px;
        padding: 0 14px;
        border: 1px solid #c8d0db;
        border-radius: 4px;
        background: #fff;
        color: #172033;
        cursor: pointer;
        font: inherit;
      }
      button.primary {
        border-color: #12664f;
        background: #12664f;
        color: #fff;
      }
      textarea {
        width: 100%;
        min-height: 360px;
        resize: vertical;
        border: 1px solid #c8d0db;
        border-radius: 6px;
        padding: 16px;
        background: #fff;
        color: #172033;
        font:
          14px/1.6 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        outline: none;
      }
      textarea:focus {
        border-color: #12664f;
        box-shadow: 0 0 0 3px rgb(18 102 79 / 12%);
      }
      #status {
        min-height: 20px;
        margin: 0;
        color: #526071;
        font-size: 13px;
      }
      #status.error {
        color: #b42318;
      }
      @media (max-width: 640px) {
        body {
          padding: 16px;
        }
        main {
          min-height: calc(100vh - 32px);
        }
        header {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>JSON 格式化</h1>
        <div class="actions" aria-label="JSON 操作">
          <button id="clear" type="button">清空</button>
          <button id="minify" type="button">压缩</button>
          <button id="format" class="primary" type="button">格式化</button>
        </div>
      </header>
      <textarea id="source" aria-label="JSON 文本" spellcheck="false">
{"project":"rs-mf","tools":["json-formatter"]}</textarea>
      <p id="status" role="status">等待输入</p>
    </main>

    <script>
      const source = document.querySelector('#source')
      const status = document.querySelector('#status')

      function transform(spaces) {
        try {
          source.value = JSON.stringify(JSON.parse(source.value), null, spaces)
          status.className = ''
          status.textContent = 'JSON 有效，已处理'
        } catch (error) {
          status.className = 'error'
          status.textContent = `JSON 无效：${error.message}`
        }
      }

      document.querySelector('#format').addEventListener('click', () => transform(2))
      document.querySelector('#minify').addEventListener('click', () => transform(0))
      document.querySelector('#clear').addEventListener('click', () => {
        source.value = ''
        status.className = ''
        status.textContent = '已清空'
        source.focus()
      })
    </script>
  </body>
</html>
