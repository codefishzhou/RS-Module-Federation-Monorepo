<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JSON 格式化</title>
    <style>
      :root {
        color: #18221f;
        background: #f3f5f2;
        font-family:
          "Avenir Next", Avenir, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: clamp(18px, 4vw, 34px);
      }
      main {
        display: grid;
        min-height: calc(100vh - 68px);
        grid-template-rows: auto 1fr auto;
        gap: 16px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        min-height: 38px;
        padding: 0 14px;
        border: 1px solid #bdc7c2;
        border-radius: 4px;
        background: #fff;
        color: #18221f;
        cursor: pointer;
        font: inherit;
      }
      button.primary {
        border-color: #11563e;
        background: #11563e;
        color: #fff;
      }
      textarea {
        width: 100%;
        min-height: 360px;
        resize: vertical;
        border: 1px solid #aebbb5;
        border-radius: 5px;
        padding: 18px;
        background: #fff;
        color: #18221f;
        font:
          14px/1.6 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        outline: none;
      }
      textarea:focus {
        border-color: #197052;
        box-shadow: 0 0 0 3px rgb(25 112 82 / 14%);
      }
      #status {
        min-height: 20px;
        margin: 0;
        color: #66736e;
        font-size: 13px;
      }
      #status.error {
        color: #b42318;
      }
      @media (max-width: 640px) {
        body {
          padding: 16px;
        }
        main {
          min-height: calc(100vh - 32px);
        }
        header {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>JSON 格式化</h1>
        <div class="actions" aria-label="JSON 操作">
          <button id="clear" type="button">清空</button>
          <button id="minify" type="button">压缩</button>
          <button id="format" class="primary" type="button">格式化</button>
        </div>
      </header>
      <textarea id="source" aria-label="JSON 文本" spellcheck="false">
{"project":"rs-mf","tools":["json-formatter"]}</textarea>
      <p id="status" role="status">等待输入</p>
    </main>

    <script>
      const source = document.querySelector('#source')
      const status = document.querySelector('#status')

      function transform(spaces) {
        try {
          source.value = JSON.stringify(JSON.parse(source.value), null, spaces)
          status.className = ''
          status.textContent = 'JSON 有效，已处理'
        } catch (error) {
          status.className = 'error'
          status.textContent = `JSON 无效：${error.message}`
        }
      }

      document.querySelector('#format').addEventListener('click', () => transform(2))
      document.querySelector('#minify').addEventListener('click', () => transform(0))
      document.querySelector('#clear').addEventListener('click', () => {
        source.value = ''
        status.className = ''
        status.textContent = '已清空'
        source.focus()
      })
    </script>
  </body>
</html>
